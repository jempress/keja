name: keja_app
description: Keja - house hunting in Kenya
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Networking
  dio: ^5.4.3
  flutter_secure_storage: ^9.2.2

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Location / maps (for the browse map view + location sharing in chat)
  google_maps_flutter: ^2.6.1
  # Pinned below ^12.x: geolocator_android 4.6.x (pulled in by newer
  # geolocator releases) has a packaging bug where its own build.gradle
  # fails to read a Flutter-injected Gradle property ("Could not get
  # unknown property 'flutter'..."), unrelated to anything in this
  # project. 10.1.x predates that regression and exposes the same API
  # (checkPermission/requestPermission/getCurrentPosition) used in
  # chat_screen.dart, so no code changes needed.
  geolocator: ^10.1.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# geolocator's own pubspec constraint on geolocator_android is loose
# enough that pub keeps resolving to 4.6.2 (the broken release) even
# with geolocator itself pinned down - a committed pubspec.lock from
# the scaffold step also keeps re-using that resolution rather than
# downgrading it. This override forces the actual implementation
# package to a version that predates the bug, bypassing normal
# constraint solving.
dependency_overrides:
  geolocator_android: 4.5.4

flutter:
  uses-material-design: true
