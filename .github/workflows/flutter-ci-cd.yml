name: Flutter CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets you trigger distribute_android manually once ready

env:
  FLUTTER_VERSION: "3.24.0"

jobs:
  build_and_test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  distribute_android:
    name: Build & distribute to Firebase App Distribution
    needs: build_and_test
    # Paused: only runs when you manually trigger it from the Actions tab
    # (Run workflow button), not on every push. Switch back to
    # `github.event_name == 'push' && github.ref == 'refs/heads/main'`
    # once the backend has a public URL and API_BASE_URL is set for real.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiles the release APK here in the Actions runner.
      # API_BASE_URL points the built app at your deployed backend
      # (not localhost — this binary goes to real testers' phones).
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keja-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          # Writing the secret to a file via a quoted env-var expansion
          # avoids both shell-quoting issues and accidental logging of
          # the secret, and preserves the JSON's real structure exactly
          # as it was pasted into the GitHub secret.
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$HOME/firebase-service-account.json"

          # Sanity-check it's actually valid JSON before we even try to
          # authenticate with it - turns "Failed to authenticate" into a
          # much clearer "your secret isn't valid JSON" if that's the issue.
          python3 -c "import json; json.load(open('$HOME/firebase-service-account.json'))" \
            || (echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not valid JSON - re-copy the full downloaded key file" && exit 1)

          npm install -g firebase-tools

          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/firebase-service-account.json"
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_ANDROID_APP_ID" \
            --groups "testers" \
            --release-notes "Automated build #${{ github.run_number }}"
